name: Publish to Pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Matches v2.0.3, v2.1.0-beta, etc.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        working-directory: packages/fletch
        run: dart pub get

      - name: Analyze
        working-directory: packages/fletch
        run: dart analyze --fatal-infos

      - name: Run Tests with coverage
        working-directory: packages/fletch
        run: dart test --coverage=coverage

      - name: Format coverage to lcov
        working-directory: packages/fletch
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/fletch/coverage/lcov.info
          fail_ci_if_error: false

  publish:
    needs: test
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        working-directory: packages/fletch
        run: dart pub get

      - name: Publish Package
        working-directory: packages/fletch
        run: ./tool/publish.sh --yes

  notify:
    name: Discord Notification
    needs: [test, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          token = os.environ.get("DISCORD_TOKEN", "").strip()
          if not token:
              print("DISCORD_TOKEN not configured, skipping")
              exit(0)

          tag     = os.environ["TAG"]
          repo    = os.environ["REPO"]
          actor   = os.environ["ACTOR"]
          version = tag.lstrip("v")
          pub_url = f"https://pub.dev/packages/fletch/versions/{version}"

          # Post directly to #announcements via the bot token
          channel_id = "1455639308089163948"
          url = f"https://discord.com/api/v10/channels/{channel_id}/messages"

          payload = {"embeds": [{
              "title":       f"📦 fletch {tag} published to pub.dev",
              "description": "All tests passed and the package is live.",
              "color":       0x57F287,
              "fields": [
                  {"name": "Version",      "value": version,                      "inline": True},
                  {"name": "Published by", "value": actor,                        "inline": True},
                  {"name": "pub.dev",      "value": f"[View package]({pub_url})", "inline": False},
              ],
              "footer": {"text": repo},
          }]}

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bot {token}",
                  "Content-Type":  "application/json",
              },
          )
          try:
              urllib.request.urlopen(req)
              print(f"Discord notified for {tag}")
          except Exception as exc:
              print(f"Discord notification failed: {exc}")
          PY
